[project]
name = "mitm-capture"
version = "0.1.0"
description = "HTTP traffic capture tool using mitmproxy"
requires-python = ">=3.8"
dependencies = ["mitmproxy", "requests", "jinja2"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "aiohttp>=3.8"]

[project.scripts]
mitm-capture = "claudit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudit"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-subprocess",
    "pytest-mock",
    "aiohttp>=3.8",
    "black",
    "pre-commit",
    "syrupy",
    "basedpyright>=1.31.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
(
  __pycache__
  | \.git
  | \.pytest_cache
  | \.venv
  | build
  | dist
)
'''

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
