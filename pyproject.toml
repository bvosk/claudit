[project]
name = "mitm-capture"
version = "0.1.0"
description = "HTTP traffic capture tool using mitmproxy"
authors = [
    {name = "Brian", email = "brian@example.com"}
]
dependencies = [
    "mitmproxy",
    "requests",
]
requires-python = ">=3.8"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "aiohttp>=3.8",
]

[project.scripts]
mitm-capture = "capture_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "aiohttp>=3.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "."]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"