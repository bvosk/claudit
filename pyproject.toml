[project]
name = "mitm-capture"
version = "0.1.0"
description = "HTTP traffic capture tool using mitmproxy"
requires-python = ">=3.8"
dependencies = ["mitmproxy", "requests"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "aiohttp>=3.8"]

[project.scripts]
mitm-capture = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["src"]
sources = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "aiohttp>=3.8",
    "black",
    "pre-commit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
(
  __pycache__
  | \.git
  | \.pytest_cache
  | \.venv
  | build
  | dist
)
'''
