services:
  mitmproxy-capture:
    build: .
    container_name: mitmproxy-capture
    environment:
      - PROXY_PORT=${PROXY_PORT:-8080}
    ports:
      - "${PROXY_PORT:-8080}:${PROXY_PORT:-8080}"
    volumes:
      - ./captures:/app/captures
      - ./prompts:/app/prompts
    env_file:
      - .env
