name: Claude Code Prompt Tracker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual triggering for testing

jobs:
  track-prompt-changes:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch full history to enable proper diffing
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Docker
        run: |
          docker --version
          docker compose version

      - name: Run docker compose with API key
        run: |
          echo "📅 Daily Claude Code Prompt Tracker"
          echo "🕐 Started at $(date)"

          # Run docker compose to capture the prompt
          echo "🐳 Running docker compose up..."
          docker compose up --build

          echo "✅ Capture process completed"
      - name: Check for prompt changes
        id: check_changes
        run: |
          echo "🔍 Checking for prompt changes..."

          # Check if the prompt file exists
          if [ ! -f "prompts/claudecode.md" ]; then
            echo "❌ prompts/claudecode.md not found"
            exit 1
          fi

          # Check if there are any changes to the prompt file
          if git diff --quiet HEAD -- prompts/; then
            echo "📝 No prompt changes detected"
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          else
            echo "📝 Prompt changes detected"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Install llm tooling
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade llm llm-anthropic

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          echo "💾 Committing changes..."

          # Configure git
          # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add the changed file
          git add prompts/

          if git diff --cached --quiet; then
            echo "⚠️ No staged changes found after adding prompts/"
            exit 0
          fi

          COMMIT_PROMPT_FILE=$(mktemp)
          cat .github/commit-message-prompt.txt > "$COMMIT_PROMPT_FILE"
          {
            printf '\nDiff:\n'
            git diff --cached
          } >> "$COMMIT_PROMPT_FILE"

          SYSTEM_PROMPT=$(cat .github/commit-message-system.txt)

          echo "🧠 Generating commit message with Claude Sonnet 4.5..."
          COMMIT_MESSAGE=$(llm -m claude-sonnet-4.5 -s "$SYSTEM_PROMPT" "$(cat "$COMMIT_PROMPT_FILE")")

          if [ -z "$COMMIT_MESSAGE" ]; then
            echo "❌ Failed to generate commit message"
            rm "$COMMIT_PROMPT_FILE"
            exit 1
          fi

          COMMIT_FILE=$(mktemp)
          printf "%s\n" "$COMMIT_MESSAGE" > "$COMMIT_FILE"

          # Create commit using generated message
          git commit -F "$COMMIT_FILE"
          rm "$COMMIT_FILE" "$COMMIT_PROMPT_FILE"

          # Push the changes
          echo "🚀 Pushing to main branch..."
          git push

          echo "✅ Changes committed and pushed successfully"

      - name: Log completion
        if: always()
        run: |
          echo "✅ Workflow completed"
          echo "🕐 Finished at $(date)"
